services:
  mt-telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt-telegram-bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: "${BOT_TOKEN:?set BOT_TOKEN}"
      ALLOWED_CHAT_ID: "${ALLOWED_CHAT_ID:?set ALLOWED_CHAT_ID}"

      MT_HOST: "${MT_HOST:?set MT_HOST}"
      MT_PORT: "${MT_PORT:-8728}"          # API 8728, API-SSL 8729 [web:41]
      MT_USER: "${MT_USER:?set MT_USER}"
      MT_PASS: "${MT_PASS:?set MT_PASS}"

      SCRIPT_ON: "${SCRIPT_ON:-inet_on_250}"
      SCRIPT_OFF: "${SCRIPT_OFF:-inet_off_250}"
      SCRIPT_STATUS: "${SCRIPT_STATUS:-inet_status_250}"
